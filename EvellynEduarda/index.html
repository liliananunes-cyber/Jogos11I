<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport", content="width=device-width, initial-scale=1.0">
        <title>Pac-Man</title>
        <link rel="stylesheet" href="pacman.css">
        <script src="pacman.js"></script>
        <link rel="icon" href="pacmanRight.png">
        <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
        <audio id="musica" loop>
            <source src="audio1.mp3" type="audio/mpeg">
          </audio>
          <button id="btn-iniciar" onclick="tocarMusica()">Iniciar Jogo</button>

<script>
  function tocarMusica() {
    const musica = document.getElementById("musica");
    musica.volume = 0.5; // volume entre 0.0 e 1.0
    musica.play();
  }
</script>
    </head>
    <body>
        <canvas id="board"></canvas>
        <style>
            body {
              margin: 0;
              height: 100vh;
              background: black;
              display: flex;
              flex-direction: column;
              justify-content: center;
              align-items: center;
            }
            #btn-iniciar {
      font-family: "Bungee", sans-serif;
      font-size: 28px;
      padding: 20px 60px;
      font-weight: bold;
      color: rgb(255, 217, 0);
      background-color: blue;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 15px rgba(0,0,0,0.5);
      transition: transform 0.2s ease;
      animation: piscar 1.2s infinite;
      margin-bottom: 20px;
      border: 2px solid rgb(255, 255, 254);

            }
    #btn-iniciar:hover {
      transform: scale(1.1);
    }

    #btn-iniciar:active {
      transform: scale(1.05);
    }

    canvas {
      border: 2px solid rgb(255, 255, 254);
      background: black;
    }
            </style>
    </body>


  
    </html>
