<!DOCTYPE html>
<!-- Declara que o documento segue o padrão HTML5 -->
<html lang="pt-BR">
  <!-- Define o idioma principal da página como português do Brasil -->

  <head>
    <meta charset="UTF-8" />
    <!-- Define a codificação de caracteres (suporte a acentos e ç) -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Força o modo de compatibilidade mais recente no Internet Explorer -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Torna o site responsivo (adapta a telas de celular, tablet, etc.) -->

    <!-- Importa o Bootstrap 4 (framework CSS para modais, botões, etc.) -->
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />

    <!-- Importa o arquivo CSS personalizado do projeto -->
    <link rel="stylesheet" href="./style.css" media="screen" />

    <!-- Importa ícones da biblioteca Boxicons (usados nos botões flutuantes) -->
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />

    <title>Jogo da Forca</title>
    <!-- Título que aparece na aba do navegador -->
  </head>

  <body>
    <!-- Container principal que centraliza todo o conteúdo do jogo -->
    <div class="container">
      <!-- Área onde aparece a imagem da forca (atualizada via JS) -->
      <div id="imagem"></div>

      <!-- Exibe a pontuação atual do jogador -->
      <div id="pontuacao">
        Pontos: <span id="pontos">0</span>
        <!-- O número de pontos é atualizado pelo JavaScript -->
        <!-- Botão para zerar a pontuação manualmente -->
        <button
          id="resetPontos"
          style="margin-left: 20px; font-size: 0.8em; padding: 6px 12px"
        >
          Zerar Pontos
        </button>
      </div>

      <!-- Área onde as letras da palavra secreta são exibidas (underscores ou letras acertadas) -->
      <div id="palavra-secreta"></div>

      <!-- Mostra a categoria da palavra e o nível de dificuldade -->
      <div id="categoria"></div>

      <!-- Botões para escolher o nível de dificuldade -->
      <div id="dificuldade">
        <button id="btn-facil" class="btn-dif">FÁCIL</button>
        <button id="btn-medio" class="btn-dif">MÉDIO</button>
        <button id="btn-dificil" class="btn-dif">DIFÍCIL</button>
      </div>

      <!-- Teclado virtual com todas as letras do alfabeto -->
      <div id="teclado">
        <!-- Primeira linha de letras (A-I) -->
        <div class="teclas">
          <button id="tecla-A" onclick="verificaLetraEscolhida('A')">A</button>
          <button id="tecla-B" onclick="verificaLetraEscolhida('B')">B</button>
          <button id="tecla-C" onclick="verificaLetraEscolhida('C')">C</button>
          <button id="tecla-D" onclick="verificaLetraEscolhida('D')">D</button>
          <button id="tecla-E" onclick="verificaLetraEscolhida('E')">E</button>
          <button id="tecla-F" onclick="verificaLetraEscolhida('F')">F</button>
          <button id="tecla-G" onclick="verificaLetraEscolhida('G')">G</button>
          <button id="tecla-H" onclick="verificaLetraEscolhida('H')">H</button>
          <button id="tecla-I" onclick="verificaLetraEscolhida('I')">I</button>
        </div>

        <!-- Segunda linha de letras (J-R) -->
        <div class="teclas">
          <button id="tecla-J" onclick="verificaLetraEscolhida('J')">J</button>
          <button id="tecla-K" onclick="verificaLetraEscolhida('K')">K</button>
          <button id="tecla-L" onclick="verificaLetraEscolhida('L')">L</button>
          <button id="tecla-M" onclick="verificaLetraEscolhida('M')">M</button>
          <button id="tecla-N" onclick="verificaLetraEscolhida('N')">N</button>
          <button id="tecla-O" onclick="verificaLetraEscolhida('O')">O</button>
          <button id="tecla-P" onclick="verificaLetraEscolhida('P')">P</button>
          <button id="tecla-Q" onclick="verificaLetraEscolhida('Q')">Q</button>
          <button id="tecla-R" onclick="verificaLetraEscolhida('R')">R</button>
        </div>

        <!-- Terceira linha de letras (S-Z) + botão de reiniciar -->
        <div class="teclas">
          <button id="tecla-S" onclick="verificaLetraEscolhida('S')">S</button>
          <button id="tecla-T" onclick="verificaLetraEscolhida('T')">T</button>
          <button id="tecla-U" onclick="verificaLetraEscolhida('U')">U</button>
          <button id="tecla-V" onclick="verificaLetraEscolhida('V')">V</button>
          <button id="tecla-W" onclick="verificaLetraEscolhida('W')">W</button>
          <button id="tecla-X" onclick="verificaLetraEscolhida('X')">X</button>
          <button id="tecla-Y" onclick="verificaLetraEscolhida('Y')">Y</button>
          <button id="tecla-Z" onclick="verificaLetraEscolhida('Z')">Z</button>
          <button id="btnReiniciar">🎮</button>
          <!-- Botão que recarrega a página (reinicia o jogo) -->
        </div>
      </div>

      <!-- Modal Bootstrap usado para mensagens de vitória, derrota ou atenção -->
      <div
        class="modal fade"
        id="myModal"
        tabindex="-1"
        role="dialog"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="exampleModalLabel"></h5>
              <!-- Título do modal (ex: "PARABÉNS!" ou "OPS!") -->
              <button
                type="button"
                class="close"
                data-dismiss="modal"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <!-- Corpo da mensagem -->
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-primary"
                data-dismiss="modal"
              >
                Fechar
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal personalizado (não Bootstrap) para adicionar nova palavra -->
      <div id="modal-alerta" class="modal-container">
        <div class="modal-add-palavra">
          <div class="modal-header-add-palavra" id="modal-titulo">
            <span id="fechaModal" class="close">×</span>
            <!-- Botão de fechar o modal -->
            <h2>ADICIONAR PALAVRA</h2>
          </div>
          <div class="modal-body-add-palavra" id="modal-mensagem">
            <input id="addPalavra" type="text" placeholder="PALAVRA" required />
            <input
              id="addCategoria"
              type="text"
              placeholder="CATEGORIA"
              required
            />
            <button onclick="adicionarPalavra()">Adicionar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Texto fixo na parte inferior que mostra o modo atual (Automático/Manual) -->
    <div id="status">Modo Automático</div>

    <!-- Botão flutuante para abrir o modal de adicionar palavra (só aparece no modo manual) -->
    <button id="abreModalAddPalavra">
      <i class="bx bx-message-square-add"></i>
    </button>

    <!-- GIF animado que aparece quando o jogador vence ou perde -->
    <img src="img/jogarNovamente.gif" id="jogarNovamente" />

    <!-- Botão flutuante para sortear nova palavra (reiniciar rodada) -->
    <button id="recarregar" onclick="sortear()">
      <i class="bx bx-refresh"></i>
    </button>

    <!-- Botão flutuante para alternar entre modo automático e manual -->
    <button id="jogarAutomatico" onclick="listaAutomatica()">
      <i class="bx bx-pause-circle"></i>
    </button>

    <!-- Scripts necessários para o Bootstrap (jQuery + Popper + Bootstrap JS) -->
    <script
      src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
      integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
      integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
      integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
      crossorigin="anonymous"
    ></script>

    <!-- Seu script JavaScript principal -->
    <script src="./script.js"></script>
  </body>
</html>
