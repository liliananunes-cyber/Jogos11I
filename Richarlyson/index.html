<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Super Mario Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="menu" id="menu">
  <h1>🍄 Super Mario Runner</h1>
  <button onclick="startGame()">Jogar</button>
</div>

<div class="hud">
  <span>Pontos: <b id="score">0</b></span>
  <span>Recorde: <b id="record">0</b></span>
</div>

<div class="game" id="game">
  <div class="background">
    <div class="mountains"></div>
    <div class="bushes"></div>
  </div>
  <div class="clouds"></div>
  <div class="pipes"></div>
  <img src="Mario.png" class="mario" id="mario">
</div>

<button class="jump-btn" onclick="jump()">PULAR</button>

<audio id="jumpSound" src="https://assets.mixkit.co/sfx/preview/mixkit-game-jump-coin-216.wav"></audio>
<audio id="gameOverSound" src="https://assets.mixkit.co/sfx/preview/mixkit-player-losing-or-failing-2042.wav"></audio>

<script src="script.js"></script>
</body>
</html>
