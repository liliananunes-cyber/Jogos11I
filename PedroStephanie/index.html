<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title>Galaxy Shooter</title>
</head>
<body>
    <section class="score-ui">
        <div>
            <span class="score">Mortos: <span>0</span></span>
            <span class="level">Dificuldade: <span>1</span></span>
            <span class="high">Pontos: <span>0</span></span>
        </div>
    </section>

    <section class="start-screen screen">
        <div>
            <h1>Galaxy Shooter</h1>
            <button class="button-play">Guerrear</button>
        </div>

        <span>A galáxia precisa de você!</span>
    </section>

    <section class="game-over screen">
        <div>
            <h1>FOI DE F</h1>
            <button class="button-restart">Morrer de Novo</button>
        </div>
    </section>

    <canvas></canvas>

    <script type="module" src="src/index.js"></script>
</body>
</html>
